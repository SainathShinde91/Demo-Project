<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="registration" class="form-container">
    <h2>Registration Form</h2>
    <form id="registerForm" onsubmit="return validateForm()">
        
        <label>Username</label>
        <input type="text" id="Username" placeholder="Enter Username" required>

    
        <label>Email</label>
        <input type="email" id="Email" placeholder="Enter Email" required>

    
        <label>Password</label>
        <input type="password" id="Password" placeholder="Enter Password" required>

        
        <label>Confirm Password</label>
        <input type="password" id="ConfirmPassword" placeholder="Confirm Password" required>

    
        <label>Gender</label>
        <select id="Gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <!-- Error display -->
        <p id="error" style="color:red; margin-top:5px;"></p>
        <!-- Success display -->
        <p id="msg" style="color:green; margin-top:5px;"></p>

     
        <button type="submit">Register</button>
    </form>
    <p>Already Registered
        <a href="#" onclick="showLogin()">Login here</a>
    </p>
</div>

<!-- Login form 1 2  -->
<div id="loginForm" style="display:none" class="form-container">
    <h2>Login</h2>
    <form onsubmit="return loginUser()">
        <label>Enter Email</label>
        <input type="email" id="loginEmail" placeholder="Email" required>

        <label>Enter Password</label>
        <input type="password" id="loginPassword" placeholder="Password" required>

        <p id="loginError" style="color:red; margin-top:5px;"></p>

        <button type="submit">Login</button>
    </form>
    <p>
        New user
        <a href="#" onclick="showRegister()">Register here</a>
    </p>
<button onclick="getUsers()">Get Users</button>
<button onclick="logout()">Logout</button>

</div>

<script src="script.js"></script>
</body>
</html>
